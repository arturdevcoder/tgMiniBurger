<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Food App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            light: '#FFF0ED',
                            DEFAULT: '#FF5722', // Яркий оранжевый
                            dark: '#E64A19',
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'brand': '0 10px 25px -5px rgba(255, 87, 34, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Скрытие скроллбара */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { background-color: #e5e7eb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }

        /* Анимации */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes badgePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .animate-badge { animation: badgePop 0.3s ease-in-out; }

        /* Задержки для элементов списка */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* Скрытые экраны (используем для JS анимаций) */
        .screen { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; }
        .screen-hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .screen-hidden-bottom { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .screen-active { transform: translate(0, 0); opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <!-- Главный контейнер телефона -->
    <div id="app" class="max-w-md w-full mx-auto relative bg-[#F8F9FA] h-[100dvh] overflow-hidden shadow-2xl flex flex-col font-sans rounded-none md:rounded-[2.5rem] md:h-[90vh] md:border-[8px] border-gray-800">
        
        <!-- ==================== ЭКРАН 1: ГЛАВНАЯ ==================== -->
        <div id="home-screen" class="screen screen-active absolute inset-0 z-10 overflow-y-auto pb-28 no-scrollbar">
            
            <!-- Шапка -->
            <header class="flex justify-between items-center p-6 bg-[#F8F9FA] sticky top-0 z-20 glass-panel">
                <div class="flex flex-col">
                    <span class="text-xs text-gray-500 font-medium mb-1">Доставка в</span>
                    <div class="flex items-center gap-1 cursor-pointer group">
                        <span class="text-sm font-bold text-gray-900 group-hover:text-brand transition">ул. Тверская, 12</span>
                        <i class="fa-solid fa-chevron-down text-brand text-[10px]"></i>
                    </div>
                </div>
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80" alt="Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm">
                    <div class="absolute top-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
            </header>

            <!-- Приветствие -->
            <div class="px-6 pt-2 pb-6">
                <h1 class="text-3xl font-extrabold text-gray-900 leading-tight">
                    Что будем <br><span class="text-brand">есть сегодня?</span> 🤤
                </h1>
            </div>

            <!-- Категории -->
            <div class="flex overflow-x-auto gap-4 px-6 mb-8 no-scrollbar">
                <button class="flex flex-col items-center justify-center min-w-[70px] h-[90px] bg-brand text-white rounded-[24px] shadow-brand active:scale-95 transition transform">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center mb-1 text-xl">🍔</div>
                    <span class="text-xs font-semibold">Бургеры</span>
                </button>
                <button class="flex flex-col items-center justify-center min-w-[70px] h-[90px] bg-white text-gray-600 rounded-[24px] shadow-soft active:scale-95 transition transform">
                    <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center mb-1 text-xl">🍕</div>
                    <span class="text-xs font-semibold">Пицца</span>
                </button>
                <button class="flex flex-col items-center justify-center min-w-[70px] h-[90px] bg-white text-gray-600 rounded-[24px] shadow-soft active:scale-95 transition transform">
                    <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center mb-1 text-xl">🥤</div>
                    <span class="text-xs font-semibold">Напитки</span>
                </button>
                <button class="flex flex-col items-center justify-center min-w-[70px] h-[90px] bg-white text-gray-600 rounded-[24px] shadow-soft active:scale-95 transition transform">
                    <div class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center mb-1 text-xl">🍟</div>
                    <span class="text-xs font-semibold">Снэки</span>
                </button>
            </div>

            <!-- Секция товаров -->
            <div class="px-6 mb-4">
                <h2 class="text-lg font-bold text-gray-900 mb-4">Популярное</h2>
                
                <div class="flex flex-col gap-6" id="products-list">
                    <!-- Товары генерируются через JS -->
                </div>
            </div>
        </div>


        <!-- ==================== ЭКРАН 2: ДЕТАЛИ ТОВАРА ==================== -->
        <div id="details-screen" class="screen screen-hidden-right absolute inset-0 z-30 bg-white flex flex-col">
            
            <!-- Шапка деталей -->
            <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-40">
                <button onclick="closeDetails()" class="w-10 h-10 bg-white/80 backdrop-blur rounded-full flex items-center justify-center shadow-sm active:scale-90 transition">
                    <i class="fa-solid fa-arrow-left text-gray-800"></i>
                </button>
                <button class="w-10 h-10 bg-white/80 backdrop-blur rounded-full flex items-center justify-center shadow-sm active:scale-90 transition text-gray-400 hover:text-red-500">
                    <i class="fa-solid fa-heart"></i>
                </button>
            </div>

            <!-- Контент (Скролл) -->
            <div class="flex-1 overflow-y-auto no-scrollbar pb-32">
                <!-- Фон и картинка -->
                <div class="relative w-full h-[45%] bg-brand-light flex items-center justify-center rounded-b-[40px] pt-10">
                    <img id="detail-img" src="" alt="Product" class="w-64 h-64 object-contain animate-float drop-shadow-2xl mix-blend-multiply">
                </div>

                <div class="px-6 pt-6">
                    <div class="flex justify-between items-start mb-2">
                        <h1 id="detail-name" class="text-2xl font-bold text-gray-900 leading-tight w-2/3">Название</h1>
                        <div class="flex items-center bg-brand text-white px-2 py-1 rounded-lg text-sm font-bold shadow-sm">
                            <i class="fa-solid fa-star text-[10px] mr-1"></i> 4.8
                        </div>
                    </div>
                    <p id="detail-desc" class="text-sm text-gray-500 mb-6">Вкуснейшее блюдо из свежих ингредиентов. Идеально для утоления голода.</p>

                    <!-- Выбор размера -->
                    <div class="mb-6">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-sm font-bold text-gray-900">Размер</h3>
                        </div>
                        <div id="detail-sizes" class="flex gap-3">
                            <!-- JS -->
                        </div>
                    </div>

                    <!-- Добавки (Топпинги) -->
                    <div class="mb-6">
                        <h3 class="text-sm font-bold text-gray-900 mb-3">Добавить топпинги</h3>
                        <div id="detail-toppings" class="flex flex-wrap gap-3">
                            <!-- JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Футер деталей (Фиксированный) -->
            <div class="absolute bottom-0 left-0 w-full bg-white p-6 shadow-[0_-10px_40px_rgba(0,0,0,0.08)] rounded-t-[30px] z-40 flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-xs text-gray-500 mb-1">Итоговая цена</span>
                    <span id="detail-total-price" class="text-2xl font-black text-gray-900">0 ₽</span>
                </div>
                <button onclick="addToCart()" class="bg-gray-900 text-white px-8 py-4 rounded-[20px] font-semibold flex items-center gap-2 active:scale-95 transition shadow-lg">
                    <span>В корзину</span>
                    <i class="fa-solid fa-bag-shopping text-sm"></i>
                </button>
            </div>
        </div>


        <!-- ==================== ЭКРАН 3: КОРЗИНА ==================== -->
        <div id="cart-screen" class="screen screen-hidden-bottom absolute inset-0 z-50 bg-[#F8F9FA] flex flex-col">
            <div class="p-6 bg-white flex justify-between items-center shadow-sm z-10">
                <h2 class="text-xl font-bold text-gray-900">Корзина</h2>
                <button onclick="closeCart()" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center active:scale-90 transition">
                    <i class="fa-solid fa-xmark text-gray-800"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-6 no-scrollbar" id="cart-items">
                <!-- JS (Товары в корзине) -->
                <div id="empty-cart-msg" class="h-full flex flex-col items-center justify-center text-center opacity-50">
                    <i class="fa-solid fa-basket-shopping text-6xl mb-4 text-gray-300"></i>
                    <p class="text-gray-500">Ваша корзина пуста</p>
                </div>
            </div>

            <!-- Чек и оформление -->
            <div id="cart-footer" class="bg-white p-6 rounded-t-[30px] shadow-[0_-10px_40px_rgba(0,0,0,0.08)] hidden">
                <div class="space-y-3 mb-6">
                    <div class="flex justify-between text-sm text-gray-500">
                        <span>Сумма заказов</span>
                        <span id="cart-subtotal" class="font-medium text-gray-900">0 ₽</span>
                    </div>
                    <div class="flex justify-between text-sm text-gray-500">
                        <span>Доставка</span>
                        <span class="font-medium text-green-500">Бесплатно</span>
                    </div>
                    <div class="h-px w-full bg-gray-100 my-2"></div>
                    <div class="flex justify-between items-end">
                        <span class="text-gray-900 font-bold">К оплате</span>
                        <span id="cart-total" class="text-2xl font-black text-brand">0 ₽</span>
                    </div>
                </div>
                <button onclick="checkout()" class="w-full bg-brand text-white py-4 rounded-[20px] font-bold text-lg active:scale-95 transition shadow-brand">
                    Оформить заказ
                </button>
            </div>
        </div>


        <!-- ==================== НИЖНЯЯ НАВИГАЦИЯ ==================== -->
        <div id="bottom-nav" class="absolute bottom-6 left-6 right-6 h-[70px] bg-gray-900 rounded-[24px] shadow-2xl flex justify-between items-center px-8 z-20 transition-transform duration-300">
            <button class="text-white flex flex-col items-center gap-1 active:scale-90 transition">
                <i class="fa-solid fa-house text-lg"></i>
                <div class="w-1 h-1 bg-brand rounded-full"></div>
            </button>
            <button class="text-gray-400 hover:text-white flex flex-col items-center gap-1 active:scale-90 transition">
                <i class="fa-regular fa-heart text-lg"></i>
            </button>
            
            <!-- Кнопка Корзины -->
            <button onclick="openCart()" class="relative -top-5 w-14 h-14 bg-brand rounded-full flex items-center justify-center shadow-brand active:scale-90 transition border-[6px] border-[#F8F9FA]">
                <i class="fa-solid fa-bag-shopping text-white"></i>
                <span id="cart-badge" class="hidden absolute top-0 -right-1 bg-white text-brand text-[10px] font-extrabold w-5 h-5 flex items-center justify-center rounded-full shadow-md">
                    0
                </span>
            </button>

            <button class="text-gray-400 hover:text-white flex flex-col items-center gap-1 active:scale-90 transition">
                <i class="fa-regular fa-bell text-lg"></i>
            </button>
            <button class="text-gray-400 hover:text-white flex flex-col items-center gap-1 active:scale-90 transition">
                <i class="fa-regular fa-user text-lg"></i>
            </button>
        </div>

    </div>

    <script>
        // === БАЗА ДАННЫХ ПРОДУКТОВ ===
        const products = [
            {
                id: 1,
                name: "Двойной Смэш Бургер",
                desc: "Две сочные говяжьи котлеты, сыр чеддер, свежий салат, фирменный соус на мягкой булочке.",
                basePrice: 550,
                img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80",
                sizes: [
                    { id: 's1', name: "Обычный", price: 0 },
                    { id: 's2', name: "Большой", price: 150 },
                    { id: 's3', name: "Монстр", price: 280 }
                ],
                toppings: [
                    { id: 't1', name: "Сыр", icon: "🧀", price: 60 },
                    { id: 't2', name: "Бекон", icon: "🥓", price: 90 },
                    { id: 't3', name: "Халапеньо", icon: "🌶️", price: 50 },
                    { id: 't4', name: "Яйцо", icon: "🍳", price: 70 }
                ]
            },
            {
                id: 2,
                name: "Пицца Пепперони",
                desc: "Классическая итальянская пицца с острой колбаской пепперони, моцареллой и томатным соусом.",
                basePrice: 650,
                img: "https://images.unsplash.com/photo-1604382355076-af4b0eb60143?w=500&q=80",
                sizes: [
                    { id: 's1', name: "25 см", price: 0 },
                    { id: 's2', name: "30 см", price: 200 },
                    { id: 's3', name: "35 см", price: 400 }
                ],
                toppings: [
                    { id: 't1', name: "Экстра сыр", icon: "🧀", price: 100 },
                    { id: 't2', name: "Грибы", icon: "🍄", price: 80 },
                    { id: 't3', name: "Оливки", icon: "🫒", price: 60 },
                    { id: 't4', name: "Острый соус", icon: "🔥", price: 40 }
                ]
            }
        ];

        // === СОСТОЯНИЕ (STATE) ===
        let cart = [];
        let currentProduct = null;
        let selectedSize = null;
        let selectedToppings = new Set(); // Хранит id выбранных топпингов

        // === DOM ЭЛЕМЕНТЫ ===
        const homeScreen = document.getElementById('home-screen');
        const detailsScreen = document.getElementById('details-screen');
        const cartScreen = document.getElementById('cart-screen');
        const bottomNav = document.getElementById('bottom-nav');
        const badge = document.getElementById('cart-badge');

        // === ИНИЦИАЛИЗАЦИЯ ГЛАВНОГО ЭКРАНА ===
        function renderHomeProducts() {
            const list = document.getElementById('products-list');
            list.innerHTML = '';
            
            products.forEach((p, index) => {
                const delayClass = `delay-${(index + 1) * 100}`;
                list.innerHTML += `
                    <div onclick="openDetails(${p.id})" class="bg-white rounded-[28px] p-4 flex gap-4 shadow-soft cursor-pointer active:scale-95 transition transform opacity-0 animate-pop-in ${delayClass}">
                        <div class="w-32 h-32 bg-brand-light rounded-[20px] flex-shrink-0 flex items-center justify-center p-2 relative overflow-hidden">
                            <img src="${p.img}" class="w-full h-full object-cover rounded-xl mix-blend-multiply scale-110">
                        </div>
                        <div class="flex flex-col justify-center flex-1 py-1">
                            <h3 class="font-bold text-gray-900 text-lg leading-tight mb-1">${p.name}</h3>
                            <div class="flex items-center text-xs text-gray-500 mb-3 gap-2">
                                <span class="flex items-center"><i class="fa-solid fa-fire text-brand mr-1"></i> 450 ккал</span>
                                <span class="flex items-center"><i class="fa-regular fa-clock text-brand mr-1"></i> 20 мин</span>
                            </div>
                            <div class="flex justify-between items-center mt-auto">
                                <span class="font-black text-gray-900 text-lg">от ${p.basePrice} ₽</span>
                                <button class="w-8 h-8 bg-black text-white rounded-full flex items-center justify-center shadow-md">
                                    <i class="fa-solid fa-arrow-right -rotate-45 text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // === ЛОГИКА ЭКРАНА ДЕТАЛЕЙ ===
        function openDetails(productId) {
            currentProduct = products.find(p => p.id === productId);
            selectedSize = currentProduct.sizes[0]; // По умолчанию первый размер
            selectedToppings.clear(); // Очищаем топпинги

            // Заполняем данные
            document.getElementById('detail-img').src = currentProduct.img;
            document.getElementById('detail-name').innerText = currentProduct.name;
            document.getElementById('detail-desc').innerText = currentProduct.desc;
            
            renderSizes();
            renderToppings();
            updateDetailPrice();

            // Анимация перехода
            detailsScreen.classList.remove('screen-hidden-right');
            bottomNav.style.transform = 'translateY(150%)'; // Прячем нижнюю панель
        }

        function closeDetails() {
            detailsScreen.classList.add('screen-hidden-right');
            bottomNav.style.transform = 'translateY(0)'; // Возвращаем нижнюю панель
        }

        function renderSizes() {
            const container = document.getElementById('detail-sizes');
            container.innerHTML = '';
            currentProduct.sizes.forEach(size => {
                const isActive = selectedSize.id === size.id;
                const bgClass = isActive ? 'bg-brand text-white border-brand shadow-brand' : 'bg-white text-gray-600 border-gray-200';
                
                container.innerHTML += `
                    <button onclick="selectSize('${size.id}')" class="flex-1 py-3 border-2 rounded-2xl font-semibold text-sm transition active:scale-95 ${bgClass}">
                        ${size.name}
                    </button>
                `;
            });
        }

        function selectSize(sizeId) {
            selectedSize = currentProduct.sizes.find(s => s.id === sizeId);
            renderSizes();
            updateDetailPrice();
        }

        function renderToppings() {
            const container = document.getElementById('detail-toppings');
            container.innerHTML = '';
            currentProduct.toppings.forEach(top => {
                const isActive = selectedToppings.has(top.id);
                const bgClass = isActive ? 'border-brand bg-brand-light text-brand' : 'border-gray-200 bg-white text-gray-700';
                const checkIcon = isActive ? '<i class="fa-solid fa-circle-check absolute top-1.5 right-1.5 text-brand"></i>' : '';
                
                container.innerHTML += `
                    <div onclick="toggleTopping('${top.id}')" class="relative border-2 rounded-xl p-3 flex flex-col items-center gap-1 cursor-pointer active:scale-95 transition ${bgClass} w-[calc(33.333%-0.5rem)]">
                        ${checkIcon}
                        <span class="text-2xl">${top.icon}</span>
                        <span class="text-xs font-semibold mt-1">${top.name}</span>
                        <span class="text-[10px] opacity-80">+${top.price}₽</span>
                    </div>
                `;
            });
        }

        function toggleTopping(toppingId) {
            if (selectedToppings.has(toppingId)) {
                selectedToppings.delete(toppingId);
            } else {
                selectedToppings.add(toppingId);
            }
            renderToppings();
            updateDetailPrice();
        }

        function updateDetailPrice() {
            let total = currentProduct.basePrice + selectedSize.price;
            selectedToppings.forEach(id => {
                total += currentProduct.toppings.find(t => t.id === id).price;
            });
            document.getElementById('detail-total-price').innerText = `${total} ₽`;
        }

        // === ЛОГИКА КОРЗИНЫ ===
        function addToCart() {
            // Подсчет цены
            let itemPrice = currentProduct.basePrice + selectedSize.price;
            let toppingNames = [];
            selectedToppings.forEach(id => {
                const t = currentProduct.toppings.find(x => x.id === id);
                itemPrice += t.price;
                toppingNames.push(t.name);
            });

            // Формирование объекта корзины
            const cartItem = {
                id: Date.now(), // уникальный id для списка
                name: currentProduct.name,
                img: currentProduct.img,
                size: selectedSize.name,
                toppings: toppingNames.join(', '),
                price: itemPrice,
                qty: 1
            };

            cart.push(cartItem);
            updateCartBadge();
            closeDetails();

            // Всплывающее уведомление (визуальное)
            const btn = document.querySelector('#bottom-nav button:nth-child(3)');
            btn.classList.add('animate-badge');
            setTimeout(() => btn.classList.remove('animate-badge'), 300);
        }

        function updateCartBadge() {
            if (cart.length > 0) {
                badge.classList.remove('hidden');
                badge.innerText = cart.length;
                
                // Анимация бейджа
                badge.classList.remove('animate-badge');
                void badge.offsetWidth; // Триггер рефлоу
                badge.classList.add('animate-badge');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openCart() {
            renderCartItems();
            cartScreen.classList.remove('screen-hidden-bottom');
            bottomNav.style.transform = 'translateY(150%)';
        }

        function closeCart() {
            cartScreen.classList.add('screen-hidden-bottom');
            bottomNav.style.transform = 'translateY(0)';
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            const footer = document.getElementById('cart-footer');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            if (cart.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyMsg);
                emptyMsg.style.display = 'flex';
                footer.classList.add('hidden');
                return;
            }

            emptyMsg.style.display = 'none';
            footer.classList.remove('hidden');
            let html = '';
            let totalSum = 0;

            cart.forEach((item, index) => {
                totalSum += item.price * item.qty;
                const delay = `delay-${(index+1)*100}`;
                
                html += `
                    <div class="bg-white rounded-2xl p-3 flex gap-3 shadow-sm mb-4 opacity-0 animate-pop-in ${delay} relative">
                        <div class="w-20 h-20 bg-gray-50 rounded-xl flex items-center justify-center p-1 shrink-0">
                            <img src="${item.img}" class="w-full h-full object-contain mix-blend-multiply">
                        </div>
                        <div class="flex-1 py-1">
                            <h4 class="font-bold text-gray-900 text-sm leading-tight">${item.name}</h4>
                            <p class="text-xs text-gray-500 mt-1">Размер: ${item.size}</p>
                            ${item.toppings ? `<p class="text-[10px] text-gray-400 truncate max-w-[150px]">+ ${item.toppings}</p>` : ''}
                            <div class="font-black text-brand text-sm mt-2">${item.price} ₽</div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('cart-subtotal').innerText = `${totalSum} ₽`;
            document.getElementById('cart-total').innerText = `${totalSum} ₽`;
        }

        function removeFromCart(itemId) {
            cart = cart.filter(i => i.id !== itemId);
            updateCartBadge();
            renderCartItems();
        }

        function checkout() {
            const btn = document.querySelector('#cart-footer button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Оформляем...';
            setTimeout(() => {
                alert('Заказ успешно оформлен! 🎉');
                cart = [];
                updateCartBadge();
                closeCart();
                btn.innerHTML = 'Оформить заказ';
            }, 1000);
        }

        // Запуск
        renderHomeProducts();

    </script>
</body>
</html>
